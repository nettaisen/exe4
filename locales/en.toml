# The bugs' names, by the bug's name in the game's rules (rules/navicust/programs' `BUGS`), for a tool that lists a
# build's bugs with their levels (nettai-match's `build`): every bug the NaviCust or a patch card can bring, each a
# full name, written out. EXE4's cards bring no bug of their own: a card raises or clears the count of one of the
# NaviCust's bugs (HP, custom, move, panel), so these are all the bugs there are, whoever brings them, each at its
# count's level. EXE4's cards have no effect lines to spell a name out from: a bug that writes what a bug EXE5's or
# EXE6's cards name writes has the name spelled out from their line (each says which), and the rest are the
# content's own, in the same style.
[bugs]
# As EXE5's and EXE6's, from their "BstBlank": the buster's blank shots.
"buster" = "Buster Blank"
# From EXE5's and EXE6's "CusHPbug" (their `custom_hp_drain`): EXE4's bug is the custom screen's HP drain.
"custom" = "Custom HP Bug"
# Ours, as EXE5's and EXE6's.
"encounter" = "Encounter Bug"
# From EXE5's and EXE6's "BatHPbug" (their `hp_drain`): EXE4's bug is the HP drain in the fight.
"hp" = "Battle HP Bug"
# Ours, as EXE5's: HubBatc's own bug, which halves the HP.
"hub" = "HubBatch Bug"
# As EXE5's and EXE6's, from their "MoveBug": the same programs' bug, the navi confused or stepping on its own.
"move" = "Movement Bug"
# As EXE5's and EXE6's, from their "PanelBug": the panel trail.
"panel" = "Panel Bug"
# Ours, as EXE5's and EXE6's.
"result" = "Result Bug"
# Ours, as EXE5's and EXE6's.
"support" = "Support Bug"
# Ours: EXE4's alone, the charged shot replaced.
"weapon" = "Weapon Bug"

# Each line a patch card shows of an effect, by the effect's kind and its one choice's name (the editor's key;
# docs/app.md §8), `{amount}` its number, `{pair.card}` and `{pair.slot}` a two-part card's other half and the slot
